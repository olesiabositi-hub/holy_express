name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # Вход по паролю: задай секрет SITE_PASSWORD (Settings → Secrets → Actions). Пусто — сайт открыт.
      - run: bun run protect
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      # Зеркало в России: Yandex Object Storage. Работает, когда заданы секреты YC_BUCKET, YC_KEY_ID, YC_SECRET.
      - name: Зеркало в Yandex Object Storage
        if: env.YC_BUCKET != ''
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync dist "s3://$YC_BUCKET" --delete --endpoint-url https://storage.yandexcloud.net --exclude "index.html"
          aws s3 cp dist/index.html "s3://$YC_BUCKET/index.html" --endpoint-url https://storage.yandexcloud.net --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          echo "Зеркало: https://$YC_BUCKET.website.yandexcloud.net/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
