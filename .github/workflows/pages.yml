name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # Вход по паролю: задай секрет SITE_PASSWORD (Settings → Secrets → Actions). Пусто — сайт открыт.
      - run: bun run protect
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      # Зеркало в России: любое S3-совместимое хранилище (корпоративное, Cloud.ru, Selectel…).
      # Включается, когда заданы секреты S3_ENDPOINT, S3_BUCKET, S3_KEY_ID, S3_SECRET (S3_REGION — по желанию).
      - name: Зеркало в S3-хранилище
        if: env.S3_BUCKET != '' && env.S3_ENDPOINT != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'ru-1' }}
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" --delete --endpoint-url "$S3_ENDPOINT" --exclude "index.html"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --endpoint-url "$S3_ENDPOINT" --cache-control "no-cache" --content-type "text/html; charset=utf-8"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
